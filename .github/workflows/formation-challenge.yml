name: Formation Challenge CI

on:
  push:
    branches:
      - challenge-level-*
      - master
  pull_request:
    branches:
      - challenge-level-*
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint
        continue-on-error: true # Allow lint warnings but still show them

      - name: Security audit
        run: npm audit --audit-level high
        continue-on-error: true # Don't fail on dev dependency issues
